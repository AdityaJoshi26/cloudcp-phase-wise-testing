version: 1
mode: flat
root: /bryck/cloudcp/DS-P5-01/large/2gb_20gb/fn02
threads: 16
seed: 498350471

content:
  type: random
  buffer_size: 8MB
  direct_io:
    enabled: true
    min_size: 256MB
  fsync: false

naming:
  charset: ascii
  alphabet: [lower, digit]
  special_chars: " "
  length: 16
