# ════════════════════════════════════════════════════════════════════════════
# Dataset   : DS-P5-01  (Phase 5 — File Type Coverage)
# Name      : All File Types, All Tiers
# Tier      : tiny   |   Filename variant: FN-12
# Size band : 100kb_1mb   |   Files in THIS spec: 1,300
# Seal cfg  : max_files=2000, target_bytes=256MB, open_batches=8
# Profile   : dt2_100gbe
# ────────────────────────────────────────────────────────────────────────────
# Generated by generate_specs.py from dataset_generation_plan.md.
# One spec per (size-band x filename-variant): datagen supports only
# ONE naming policy per spec, so this is how exact per-variant counts
# are achieved. File TYPES are sampled from the weighted `extensions`
# catalogue below (per-type share is therefore APPROXIMATE).
# ────────────────────────────────────────────────────────────────────────────
# FN-12 APPROX: shell metacharacters injected via special_chars pool; exact placement not guaranteed.
# NOTE: exact count not divisible for the requested tree depth (3); using flat mode (single dir) to keep the count exact.
# Real file content (valid JPEG/gzip/parquet) is NOT produced by datagen; content is random/sparse bytes only.
# Per-type exact counts are APPROX (weighted sampling).
# ════════════════════════════════════════════════════════════════════════════

version: 1
mode: flat
root: /bryck/cloudcp/DS-P5-01/tiny/100kb_1mb/fn12
threads: 16
seed: 1097147073

content:
  type: random
  buffer_size: 8MB
  direct_io: { enabled: false }
  fsync: false

naming:
  charset: ascii
  alphabet: [lower, digit]
  special_chars: "$!&;|"
  length: 14
  collision_strategy: append-index

flat:
  num_files: 1300

size:
  type: range
  min: 102400
  max: 1048576
  distribution: uniform

extensions:
  - { ext: .csv, weight: 1 }
  - { ext: .json, weight: 1 }
  - { ext: .txt, weight: 1 }
  - { ext: .log, weight: 1 }
  - { ext: .sql, weight: 1 }
  - { ext: .xml, weight: 1 }
  - { ext: .yaml, weight: 1 }
  - { ext: .bin, weight: 1 }
  - { ext: .gz, weight: 1 }
  - { ext: .tar, weight: 1 }
  - { ext: .zip, weight: 1 }
  - { ext: .zst, weight: 1 }
  - { ext: .bz2, weight: 1 }
  - { ext: .7z, weight: 1 }
  - { ext: .parquet, weight: 1 }
  - { ext: .avro, weight: 1 }
  - { ext: .orc, weight: 1 }
  - { ext: .arrow, weight: 1 }
  - { ext: .hdf5, weight: 1 }
  - { ext: .jpg, weight: 1 }
  - { ext: .png, weight: 1 }
  - { ext: .mp4, weight: 1 }
  - { ext: .mkv, weight: 1 }
  - { ext: .wav, weight: 1 }
  - { ext: .so, weight: 1 }
  - { ext: "", weight: 1 }
