version: 1
mode: tree
root: /bryck/cloudcp/DS-P1-02/tiny/10kb_100kb/fn10
threads: 16
seed: 1534361120

content:
  type: random
  buffer_size: 8MB
  direct_io: { enabled: false }
  fsync: false

naming:
  charset: ascii
  alphabet: [lower, digit]
  special_chars: " "
  suffix: "\r"
  length: 14
  collision_strategy: append-index

tree:
  fanout: 5
  depth: 4
  files_per_dir: 48
  files_in_each_dir: false

size:
  type: range
  min: 10240
  max: 102400
  distribution: uniform

extensions:
  - { ext: .csv, weight: 1 }
  - { ext: .json, weight: 1 }
  - { ext: .txt, weight: 1 }
  - { ext: .log, weight: 1 }
  - { ext: .sql, weight: 1 }
  - { ext: .bin, weight: 1 }
  - { ext: .gz, weight: 1 }
  - { ext: .tar, weight: 1 }
  - { ext: .parquet, weight: 1 }
  - { ext: .jpg, weight: 1 }
  - { ext: .mp4, weight: 1 }
  - { ext: "", weight: 1 }
