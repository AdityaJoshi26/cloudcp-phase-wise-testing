version: 1
mode: flat
root: /bryck/cloudcp/DS-P8-05/tiny/1kb_1mb/fn06
threads: 16
seed: 389346882

content:
  type: random
  buffer_size: 8MB
  direct_io: { enabled: false }
  fsync: false

naming:
  charset: mixed
  alphabet: [lower, digit]
  unicode_blocks:
    - latin-supplement
  special_chars: "_"
  length: 16
  collision_strategy: append-index

flat:
  num_files: 50

size:
